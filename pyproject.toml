[project]
name = "bcp_project"
version = "0.1.0"
description = "Phase 1 PDF ingestion pipeline for document summary and chunk storage in Qdrant."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "boto3>=1.30.0",
    "passlib[bcrypt]>=1.7.0",
    "bcrypt<4.0.0",
    "python-jose>=3.3.0",
    "python-dotenv>=1.0.0",
    "llama-index>=0.10.0",
    "llama-parse>=0.1.0",
    "qdrant-client>=1.6.0",
    "redis>=5.0.0",
    "resend>=2.0.0",
    "apscheduler>=3.10.0",
    "pydantic>=1.10.0",
    "openai>=1.0.0",
    "pypdf>=3.0.0",
    "pdf2image>=1.16.0",
    "pytesseract>=0.3.10",
]
readme = "README.md"

[project.scripts]
bcp-project = "bcp_project.main:main"
