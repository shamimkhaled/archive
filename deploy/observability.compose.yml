# Monitoring stack: Prometheus, Alertmanager, Grafana and exporters.
#
#   openssl rand -hex 32 > deploy/prometheus/metrics_token
#   echo "METRICS_TOKEN=$(cat deploy/prometheus/metrics_token)" >> .env
#   cp deploy/prometheus/alertmanager.example.yml deploy/prometheus/alertmanager.yml
#   GRAFANA_ADMIN_PASSWORD=... docker compose -f docker-compose.yml \
#     -f deploy/observability.compose.yml --profile pipeline up -d
#
# Paths are relative to the repository root (the first compose file).
# Grafana: http://127.0.0.1:3000   Prometheus: http://127.0.0.1:9090

x-metrics-port: &metrics_port
  METRICS_PORT: "9108"

services:
  web:
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN (see header)}
  outbox-relay:
    environment:
      <<: *metrics_port
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
  worker-ingest:
    environment:
      <<: *metrics_port
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
  worker-meeting:
    environment:
      <<: *metrics_port
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
  worker-notify:
    environment:
      <<: *metrics_port
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/bcpdb?sslmode=disable
    depends_on: [postgres]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./deploy/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
