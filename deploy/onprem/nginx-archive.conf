# TLS front end for the archive web tier in the bank data centre.
#
# Terminates TLS 1.2/1.3 (Mozilla "intermediate" profile), forwards to the web
# VMs over the application VLAN, and appends the client address to
# X-Forwarded-For. With this proxy alone set TRUSTED_PROXY_HOPS=1 on the web
# tier; with a hardware load balancer or WAF in front of it as well, set 2.
#
# Replace archive.bank.local, the certificate paths, the upstream addresses and
# the monitoring subnet before use. Test with: nginx -t, then
#   testssl.sh https://archive.bank.local   (expects no TLS 1.0/1.1, no weak ciphers)

upstream archive_web {
    least_conn;
    server 10.20.10.11:8080 max_fails=3 fail_timeout=15s;
    server 10.20.10.12:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Plain HTTP only redirects.
server {
    listen 80;
    listen [::]:80;
    server_name archive.bank.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name archive.bank.local;

    ssl_certificate     /etc/nginx/tls/archive.bank.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/archive.bank.local.key;
    ssl_trusted_certificate /etc/nginx/tls/bank-ca-chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ArchiveTLS:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The app sets CSP, frame, referrer and permissions headers; HSTS is set here
    # so it also covers error pages nginx serves itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Document uploads (MAX_UPLOAD_MB=50 in the app); recordings get their own limit below.
    client_max_body_size 60m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/archive_access.log combined;
    error_log  /var/log/nginx/archive_error.log warn;

    # Scrapes come from the monitoring subnet only, with the bearer token as well.
    location = /metrics {
        allow 10.20.90.0/24;
        deny all;
        proxy_pass http://archive_web;
    }

    # Upload progress is streamed (server-sent events); do not buffer it.
    location ~ ^/(upload|api/ingest) {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://archive_web;
    }

    # Meeting recordings (MEETING_RECORDING_MAX_MB=500) and live transcription chunks.
    location ~ ^/(api/)?meetings/ {
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://archive_web;
    }

    # Ask Sonali and briefings can wait on the model for tens of seconds.
    location ~ ^/(api/v1/ask|ask|board/) {
        proxy_read_timeout 180s;
        proxy_pass http://archive_web;
    }

    location / {
        proxy_pass http://archive_web;
    }
}
