services:
  postgres:
    image: postgres:16
    container_name: bcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bcpdb
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bcp-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped

  # Optional durable chunk-index worker (API must set ENABLE_JOB_QUEUE=1).
  # Uncomment after building an app image, or run locally:
  #   ENABLE_JOB_QUEUE=1 PYTHONPATH=src python -m bcp_project.jobs.worker
  # worker:
  #   build: .
  #   command: ["python", "-m", "bcp_project.jobs.worker"]
  #   environment:
  #     ENABLE_JOB_QUEUE: "1"
  #     REDIS_URL: redis://redis:6379/0
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/bcpdb
  #   depends_on:
  #     - redis
  #     - qdrant
  #   restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
